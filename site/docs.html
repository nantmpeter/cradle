## 1. 快速开始

### 1.1 环境要求

| 依赖 | 版本 | 说明 |
|------|------|------|
| Rust | 1.85+ (edition 2024) | 后端编译 |
| Node.js | 20+ | 前端构建 |
| PostgreSQL | 16 | 数据库 |
| pnpm | 推荐 | 前端包管理 |

### 1.2 启动步骤

\`\`\`bash
# 1. 克隆项目
git clone <repo-url> && cd cradle

# 2. 启动数据库（二选一）
docker compose up db -d              # Docker 方式
# createdb cradle                # 本地 PostgreSQL

# 3. 启动后端
cd apps/backend
cp config/default.toml config/local.toml   # 复制配置
cargo run                                   # 启动（自动迁移）
# → http://localhost:8080

# 4. 启动前端
cd apps/frontend
pnpm install
pnpm dev
# → http://localhost:5173
\`\`\`

### 1.3 默认账号

| 邮箱 | 密码 | 角色 |
|------|------|------|
| \`admin@example.com\` | \`Admin@1234\` | superadmin |

## 2. 配置说明

后端配置文件位于 \`apps/backend/config/\`，加载顺序：\`default.toml\` → \`local.toml\`（覆盖） → 环境变量（\`APP__\` 前缀）。

### 2.1 完整配置项

\`\`\`toml
[server]
host = "0.0.0.0"           # 监听地址
port = 8080                 # 监听端口

[database]
url = "postgres://dev:dev@localhost:5432/cradle"
max_connections = 10        # 连接池大小

[jwt]
secret = "change-me-in-production-use-strong-random-key"  # JWT 签名密钥（生产环境必改）
access_exp_secs = 3600      # Access Token 有效期（秒）
refresh_exp_secs = 604800   # Refresh Token 有效期（秒）

[rate_limit]
global_rpm = 100            # 全局每分钟请求数上限
login_rpm = 5               # 登录接口每分钟请求数上限

[storage]
upload_dir = "./uploads"    # 文件上传目录
max_upload_size = 10485760  # 文件大小上限（10 MB）
max_avatar_size = 2097152   # 头像大小上限（2 MB）

[totp]
encryption_key = "jBrgUIZ+TRxlYByzq83lkK0pR9lLQQP/ZmRWxDK6r8A="  # TOTP 密钥加密 key

[api]
version = "v1"                    # API 版本号
legacy_routes_enabled = true      # 是否启用旧路由兼容（/api/*）
docs_enabled = true               # 是否启用 Swagger UI

[api.wechat]
enabled = false
app_id = ""
app_secret = ""

[api.sms]
enabled = false
provider = ""
template_id = ""

[api.github]                       # GitHub OAuth2
client_id = ""
client_secret = ""

[api.google]                       # Google OAuth2
client_id = ""
client_secret = ""

[webhook]
max_retries = 3                          # 最大重试次数
retry_intervals_secs = [60, 300, 1800]   # 重试间隔（秒），指数退避
timeout_secs = 10                        # HTTP 请求超时（秒）
\`\`\`

### 2.2 环境变量覆盖

环境变量使用 \`APP__\` 前缀 + \`__\` 分隔符，例如：

\`\`\`bash
APP__DATABASE__URL=postgres://user:pass@host:5432/db
APP__JWT__SECRET=my-production-secret
APP__SERVER__PORT=9090
\`\`\`

## 3. 认证体系

系统支持三种认证方式，分别对应三个 API 层：

| 认证方式 | 使用场景 | 请求头 |
|---------|---------|--------|
| JWT + RBAC | 管理后台 (Admin) | \`Authorization: Bearer <access_token>\` |
| JWT (client_type=app) | 移动端/小程序 (App) | \`Authorization: Bearer <access_token>\` |
| API Key + Scope | 第三方接入 (Open) | \`Authorization: Bearer rk_xxx\` 或 \`X-API-Key: rk_xxx\` |

### 3.1 JWT 认证流程

\`\`\`
┌──────────┐    POST /api/auth/login     ┌──────────┐
│  Client  │ ──────────────────────────→ │  Server  │
│          │ ←────────────────────────── │          │
│          │  { access_token, refresh_token }       │
│          │                              │          │
│          │  GET /api/v1/admin/users     │          │
│          │  Authorization: Bearer xxx   │          │
│          │ ──────────────────────────→ │          │
│          │ ←────────────────────────── │          │
│          │  { data: [...] }            │          │
└──────────┘                              └──────────┘
\`\`\`

### 3.2 登录接口

**POST** \`/api/auth/login\`

请求：
\`\`\`json
{
  "email": "admin@example.com",
  "password": "Admin@1234"
}
\`\`\`

成功响应 (200)：
\`\`\`json
{
  "access_token": "eyJ...",
  "refresh_token": "eyJ...",
  "token_type": "bearer",
  "must_change_password": false
}
\`\`\`

需要 2FA 时响应 (401)：
\`\`\`json
{
  "error": {
    "code": "TWO_FACTOR_REQUIRED",
    "message": "Two-factor authentication required",
    "request_id": null,
    "details": null
  },
  "status": 401
}
\`\`\`

此时需用 \`temp_token\` 继续验证：
\`\`\`json
{
  "access_token": "eyJ...",
  "refresh_token": "eyJ...",
  "token_type": "bearer",
  "must_change_password": false,
  "requires_2fa": true,
  "temp_token": "temp_xxx..."
}
\`\`\`

**POST** \`/api/auth/2fa/verify\`

请求：
\`\`\`json
{
  "temp_token": "temp_xxx...",
  "code": "123456"
}
\`\`\`

### 3.3 Token 刷新

**POST** \`/api/auth/refresh\`

请求：
\`\`\`json
{
  "refresh_token": "eyJ..."
}
\`\`\`

响应同登录成功响应。

### 3.4 注册

**POST** \`/api/auth/register\`

请求：
\`\`\`json
{
  "email": "new@example.com",
  "password": "StrongPass@123",
  "name": "New User"
}
\`\`\`

密码规则：至少 8 位，且包含以下 4 类中至少 3 类：大写字母、小写字母、数字、特殊字符。

注册用户自动获得 \`user\` 角色。

## 4. API 路由架构

### 4.1 三层路由体系

| 层 | 前缀 | 认证 | 说明 |
|----|------|------|------|
| **Admin** | \`/api/v1/admin/*\` | JWT + RBAC + 权限校验 | 管理后台接口 |
| **App** | \`/api/v1/app/*\` | JWT (client_type=app) | 移动端 / 小程序接口 |
| **Open** | \`/api/v1/open/*\` | API Key + Scope | 第三方开放接口 |
| **Legacy** | \`/api/*\` | JWT + RBAC | 旧版路由兼容（带 Deprecation 响应头） |

### 4.2 旧路由兼容

旧路由 (\`/api/users\`, \`/api/roles\` 等) 保持完全可用，响应头自动附加：

\`\`\`
Deprecation: true
X-Legacy-Route: true
\`\`\`

可通过配置 \`api.legacy_routes_enabled = false\` 关闭。

以下路由保持原有路径，不受版本化影响：

## 8. API Key 管理

### 8.1 API Key 格式

- 前缀：\`rk_\` + base64url 编码的 32 字节随机数
- 存储：SHA-256 哈希后存储，原始 Key 仅在创建时返回一次
- 前缀展示：前 8 个字符用于识别（如 \`rk_abcDEF\`）

### 8.2 CRUD 接口

| 方法 | 路径 | 说明 | 权限 |
|------|------|------|------|
| POST | \`/api-keys\` | 创建 API Key | api-keys:manage |
| GET | \`/api-keys\` | 列表 | - |
| DELETE | \`/api-keys/{id}\` | 吊销 | api-keys:manage |

**创建 API Key** \`POST /api/v1/admin/api-keys\`

请求：
\`\`\`json
{
  "name": "My Integration",
  "scopes": ["users:read", "departments:read"],
  "expires_at": "2027-01-01T00:00:00Z"
}
\`\`\`

响应（**明文 Key 仅此一次返回**）：
\`\`\`json
{
  "id": "uuid",
  "name": "My Integration",
  "key": "rk_dGhpcyBpcyBhIHRlc3Qg...",
  "key_prefix": "rk_dGhpcy",
  "scopes": ["users:read", "departments:read"],
  "expires_at": "2027-01-01T00:00:00Z"
}
\`\`\`

### 8.3 Scope 权限

| Scope | 说明 |
|-------|------|
| \`users:read\` | 读取用户信息 |
| \`departments:read\` | 读取部门信息 |
| \`*\` | 通配符，允许所有权限 |

可自定义扩展更多 Scope。

### 8.4 安全机制

- API Key 认证支持 \`Authorization: Bearer\` 和 \`X-API-Key\` 两种方式
- 过期的 Key 自动失效（401）
- 被吊销的 Key 立即失效（401）
- 每次使用自动更新 \`last_used_at\`（异步，不影响响应时间）

## 9. OAuth2 第三方登录

### 9.1 支持的提供商

| 提供商 | 配置项 | 状态 |
|--------|--------|------|
| GitHub | \`[api.github]\` | ✅ 已实现 |
| Google | \`[api.google]\` | ✅ 已实现 |
| WeChat | \`[api.wechat]\` | 📋 预留 |

### 9.2 配置 OAuth

以 GitHub 为例：

\`\`\`toml
[api.github]
client_id = "your-github-client-id"
client_secret = "your-github-client-secret"
\`\`\`

GitHub OAuth App 配置：
1. 前往 GitHub → Settings → Developer settings → OAuth Apps → New OAuth App
2. Authorization callback URL 填写：\`http://your-domain/api/v1/app/auth/callback?provider=github\`
3. 将 Client ID 和 Client Secret 填入配置

### 9.3 OAuth 流程

\`\`\`
┌──────────┐   1. GET /auth/authorize?provider=github   ┌──────────┐
│  App     │ ──────────────────────────────────────────→ │  Server  │
│          │ ←──── { url: "github.com/oauth/..." } ──── │          │
│          │                                              │          │
│  Browser │   2. 用户跳转到 GitHub 授权页面              │          │
│          │   3. GitHub 重定向回 callback                 │          │
│          │                                              │          │
│          │   4. GET /auth/callback?provider=github&code=xxx      │
│          │ ──────────────────────────────────────────→ │          │
│          │ ←──── { access_token, refresh_token } ──────│          │
│          │                                              │          │
│          │   (Token 的 client_type=app)                 │          │
└──────────┘                                              └──────────┘
\`\`\`

### 9.4 自动注册/关联逻辑

OAuth 回调时的用户匹配策略：

1. **已有绑定**：\`provider\` + \`provider_user_id\` 匹配 → 直接登录
2. **同邮箱关联**：OAuth 邮箱与已有用户邮箱一致 → 自动关联并登录
3. **新用户**：创建新用户（随机密码）+ 关联 → 登录

### 9.5 绑定/解绑

已登录用户可以绑定/解绑第三方账号：

**绑定** \`POST /api/v1/app/auth/social-bind\`
\`\`\`json
{
  "provider": "github",
  "code": "oauth-authorization-code"
}
\`\`\`

**解绑** \`POST /api/v1/app/auth/social-unbind\`
\`\`\`json
{
  "provider": "github"
}
\`\`\`

## 10. Webhook 出站通知

### 10.1 概述

Webhook 允许你订阅系统事件，当事件触发时，系统会向指定 URL 发送 HTTP POST 请求。

特性：
- HMAC-SHA256 签名验证
- 自动重试（指数退避：60s → 5min → 30min，最多 3 次）

  "updated_at": "2026-05-25T10:00:00Z"
}
\`\`\`

### 10.3 可订阅事件

| 事件 | 触发时机 |
|------|---------|
| \`user.created\` | 创建用户 |
| \`user.updated\` | 更新用户 |
| \`user.deleted\` | 删除用户 |

### 10.4 投递格式

系统向 Webhook URL 发送 POST 请求，包含以下 Headers：

| Header | 说明 |
|--------|------|
| \`X-Webhook-Signature\` | HMAC-SHA256 签名（base64url） |
| \`X-Webhook-Event\` | 事件名称 |
| \`X-Webhook-ID\` | 投递记录 ID |

Body 示例：
\`\`\`json
{
  "event": "user.created",
  "timestamp": "2026-05-25T10:00:00Z",
  "data": {
    "id": "uuid",
    "email": "new@example.com"
  }
}
\`\`\`

### 10.5 签名验证

接收方可以用签名验证请求真实性：

\`\`\`python
import hmac, hashlib, base64

def verify_signature(secret: str, payload: bytes, signature: str) -> bool:
    expected = base64.urlsafe_b64encode(
        hmac.new(secret.encode(), payload, hashlib.sha256).digest()
    ).decode().rstrip('=')
    return hmac.compare_digest(expected, signature)

# 示例
verify_signature("webhook-secret", request.body, request.headers["X-Webhook-Signature"])
\`\`\`

### 10.6 重试机制

- 首次投递失败后进入重试队列
- 重试间隔：60s → 5min → 30min（可配置）
- 最大重试次数：3 次（可配置）
- 响应状态码非 2xx 视为失败

## 16. FAQ

### Q: 登录返回 TWO_FACTOR_REQUIRED 但我已禁用 2FA？

检查 \`users\` 表中 \`two_factor_enabled\` 是否为 \`false\`。可能手动测试时开启了 2FA 未关闭。测试框架会自动重置。

### Q: 旧路由还能用吗？

可以。所有 \`/api/*\` 路由完全兼容，只是响应头会带 \`Deprecation: true\`。设置 \`api.legacy_routes_enabled = false\` 可关闭。

### Q: API Key 创建后能看到明文吗？

不能。明文 Key 仅在创建响应中返回一次。数据库只存储 SHA-256 哈希。如果丢失需要吊销后重新创建。

### Q: Webhook 投递失败怎么办？

系统自动重试 3 次（间隔 60s/5min/30min）。可以通过 \`GET /webhooks/{id}/deliveries\` 查看投递日志和失败原因。

### Q: 如何给第三方接入方创建 API Key？

1. 使用管理员账号登录
2. 调用 \`POST /api/v1/admin/api-keys\` 创建 Key（需要 \`api-keys:manage\` 权限）
3. 将返回的 \`rk_xxx\` 明文 Key 安全地交给接入方
4. 接入方使用 \`Authorization: Bearer rk_xxx\` 或 \`X-API-Key: rk_xxx\` 请求 Open API

### Q: 数据库迁移怎么执行？

后端启动时自动执行迁移。也可以手动执行：

\`\`\`bash
cd apps/backend
sqlx migrate run          # 执行迁移
sqlx migrate revert       # 回退最后一次迁移
sqlx migrate info         # 查看迁移状态
\`\`\`

### Q: 前端如何切换中英文？

前端使用 \`i18next\`，通过 Header 右上角的语言切换按钮切换，或调用 \`GET /api/i18n/messages\` 获取翻译文件。

### Q: Swagger UI 在哪里？

启动后端后访问 \`http://localhost:8080/docs\`。可通过 \`api.docs_enabled = false\` 关闭。

## 3. Authentication

Three authentication methods correspond to three API tiers:

| Method | Use Case | Header |
|--------|----------|--------|
| JWT + RBAC | Admin dashboard | \`Authorization: Bearer <access_token>\` |
| JWT (client_type=app) | Mobile / Mini-program | \`Authorization: Bearer <access_token>\` |
| API Key + Scope | Third-party integration | \`Authorization: Bearer rk_xxx\` or \`X-API-Key: rk_xxx\` |

### 3.1 Login

**POST** \`/api/auth/login\`

Request:
\`\`\`json
{
  "email": "admin@example.com",
  "password": "Admin@1234"
}
\`\`\`

Success (200):
\`\`\`json
{
  "access_token": "eyJ...",
  "refresh_token": "eyJ...",
  "token_type": "bearer",
  "must_change_password": false
}
\`\`\`

2FA required (401):
\`\`\`json
{
  "error": {
    "code": "TWO_FACTOR_REQUIRED",
    "message": "Two-factor authentication required",
    "request_id": null,
    "details": null
  },
  "status": 401
}
\`\`\`

The 2FA response also includes \`requires_2fa: true\` and \`temp_token\` for the next step.

**POST** \`/api/auth/2fa/verify\`

Request:
\`\`\`json
{
  "temp_token": "temp_xxx...",
  "code": "123456"
}
\`\`\`

### 3.2 Token Refresh

**POST** \`/api/auth/refresh\`

Request:
\`\`\`json
{ "refresh_token": "eyJ..." }
\`\`\`

### 3.3 Registration

**POST** \`/api/auth/register\`

Request:
\`\`\`json
{
  "email": "new@example.com",
  "password": "StrongPass@123",
  "name": "New User"
}
\`\`\`

Password rules: minimum 8 characters, at least 3 of: uppercase, lowercase, digit, special character. New users get the \`user\` role automatically.

## 4. API Routing Architecture

### 4.1 Three-Tier Routing

| Tier | Prefix | Auth | Description |
|------|--------|------|-------------|
| **Admin** | \`/api/v1/admin/*\` | JWT + RBAC + permission check | Management dashboard |
| **App** | \`/api/v1/app/*\` | JWT (client_type=app) | Mobile / Mini-program |
| **Open** | \`/api/v1/open/*\` | API Key + Scope | Third-party integration |
| **Legacy** | \`/api/*\` | JWT + RBAC | Backward compatibility (with Deprecation header) |

### 4.2 Legacy Route Compatibility

Legacy routes remain fully functional with added response headers:

\`\`\`
Deprecation: true
X-Legacy-Route: true
\`\`\`

Set \`api.legacy_routes_enabled = false\` to disable.

### 4.3 Non-Versioned Routes

| Path | Description |
|------|-------------|
| \`/api/auth/*\` | Auth (login, register, refresh, 2FA) |
| \`/api/sse/notifications\` | SSE real-time notification stream |
| \`/api/i18n/messages\` | i18n messages |
| \`/api/configs/public\` | Public configuration |

## 10. Webhook Outbound Notifications

### 10.1 Overview

Webhooks let you subscribe to system events. When triggered, the server sends HTTP POST to your URL.

Features:
- HMAC-SHA256 signature verification
- Automatic retry with exponential backoff (60s → 5min → 30min, max 3 retries)
- Delivery log queries

### 10.2 CRUD Endpoints

| Method | Path | Description | Permission |
|--------|------|-------------|------------|
| POST | \`/webhooks\` | Create webhook | webhooks:manage |
| GET | \`/webhooks\` | Webhook list | — |
| PUT | \`/webhooks/{id}\` | Update webhook | webhooks:manage |
| DELETE | \`/webhooks/{id}\` | Delete webhook | webhooks:manage |
| GET | \`/webhooks/{id}/deliveries\` | Delivery logs | webhooks:manage |

**Create Webhook** \`POST /api/v1/admin/webhooks\`

Request:
\`\`\`json
{
  "name": "User Sync",
  "url": "https://example.com/webhook",
  "events": ["user.created", "user.updated", "user.deleted"]
}
\`\`\`

### 10.3 Available Events

| Event | Trigger |
|-------|---------|
| \`user.created\` | User created |
| \`user.updated\` | User updated |
| \`user.deleted\` | User deleted |

### 10.4 Delivery Format

POST request to your URL with headers:

| Header | Description |
|--------|-------------|
| \`X-Webhook-Signature\` | HMAC-SHA256 signature (base64url) |
| \`X-Webhook-Event\` | Event name |
| \`X-Webhook-ID\` | Delivery record ID |

Body example:
\`\`\`json
{
  "event": "user.created",
  "timestamp": "2026-05-25T10:00:00Z",
  "data": {
    "id": "uuid",
    "email": "new@example.com"
  }
}
\`\`\`

### 10.5 Signature Verification

\`\`\`python
import hmac, hashlib, base64

def verify_signature(secret: str, payload: bytes, signature: str) -> bool:
    expected = base64.urlsafe_b64encode(
        hmac.new(secret.encode(), payload, hashlib.sha256).digest()
    ).decode().rstrip('=')
    return hmac.compare_digest(expected, signature)
\`\`\`

### 10.6 Retry Mechanism

- Failed deliveries enter the retry queue
- Retry intervals: 60s → 5min → 30min (configurable)
- Max retries: 3 (configurable)
- Non-2xx status codes are treated as failures

## 16. FAQ

### Q: Login returns TWO_FACTOR_REQUIRED but I disabled 2FA?

Check the \`users\` table — \`two_factor_enabled\` might still be \`true\` from manual testing.

### Q: Can I still use the old routes?

Yes. All \`/api/*\` routes are fully compatible. They include a \`Deprecation: true\` header. Set \`api.legacy_routes_enabled = false\` to disable.

### Q: Can I see the plaintext API Key after creation?

No. The plaintext key is returned only in the creation response. The database stores only the SHA-256 hash. If lost, revoke and create a new one.

### Q: What happens when webhook delivery fails?

The system retries 3 times (60s/5min/30min intervals). Check \`GET /webhooks/{id}/deliveries\` for delivery logs and failure reasons.

### Q: How do I create an API Key for a third party?

1. Login as admin
2. \`POST /api/v1/admin/api-keys\` (requires \`api-keys:manage\`)
3. Securely share the \`rk_xxx\` plaintext key with the integrator
4. They use \`Authorization: Bearer rk_xxx\` or \`X-API-Key: rk_xxx\` for Open API calls

### Q: How do database migrations work?

Migrations run automatically on backend startup. Manual commands:

\`\`\`bash
cd apps/backend
sqlx migrate run          # Run pending migrations
sqlx migrate revert       # Revert last migration
sqlx migrate info         # Show migration status
\`\`\`

### Q: Where is Swagger UI?

Visit \`http://localhost:8080/docs\` after starting the backend. Disable with \`api.docs_enabled = false\`.

## 踩坑速查

| 问题 | 原因 | 解决方案 |
|------|------|----------|
| Axum 中间件不生效 | 未用 \`from_fn_with_state\` | 显式 \`.layer()\` 挂载到 Router group |
| sqlx QueryBuilder count 错误 | 表别名不一致 | data query 和 count query 使用相同别名 |
| 测试并发导致 admin 锁定 | 共享数据库 | \`create_test_app\` 中重置 \`locked_until\` |
| 2FA 后登录失败 | admin 手动开启了 2FA | 测试中重置 \`two_factor_enabled=false\` |
| EventSource 无法自定义 header | 浏览器限制 | SSE 端点用 query param 传 token |
| TOTP 依赖编译失败 | 缺少 feature | \`totp-rs\` 添加 \`gen_secret\` + \`otpauth\` |

完整内容参见 \`docs/cradle-dev-skill.md\`。
`,
    };

    // ==================== Theme ====================
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      updateThemeIcon(!isDark);
      updateHljsTheme(!isDark);
    }

    function updateThemeIcon(isDark) {
      document.querySelector('.icon-sun').style.display = isDark ? 'none' : 'block';
      document.querySelector('.icon-moon').style.display = isDark ? 'block' : 'none';
    }

    function updateHljsTheme(isDark) {
      document.getElementById('hljs-light').disabled = isDark;
      document.getElementById('hljs-dark').disabled = !isDark;
    }

    (function initTheme() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved === 'dark' || (!saved && prefersDark);
      if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
      updateThemeIcon(isDark);
      updateHljsTheme(isDark);
    })();

    // ==================== Sidebar ====================
    function renderSidebar(activeId) {
      const sidebar = document.getElementById('sidebar');
      let html = '<div class="sidebar-section">';
      html += '<div class="sidebar-label">文档</div>';
      DOCS.forEach(doc => {
        const cls = doc.id === activeId ? ' class="active"' : '';
        html += `<a href="?file=${doc.id}"${cls}><span class="sidebar-dot"></span>${doc.label}</a>`;
      });
      html += '</div>';
      sidebar.innerHTML = html;
    }

    // ==================== TOC ====================
    function renderTOC() {
      const body = document.getElementById('markdown-body');
      const headings = body.querySelectorAll('h2, h3');
      const toc = document.getElementById('toc');
      if (headings.length === 0) { toc.innerHTML = ''; return; }

      let html = '<div class="toc-label">目录</div>';
      headings.forEach(h => {
        // Add id for anchor
        if (!h.id) {
          h.id = h.textContent.trim().replace(/[^\w\u4e00-\u9fff]+/g, '-').toLowerCase();
        }
        const cls = h.tagName === 'H3' ? ' toc-h3' : '';
        html += `<a href="#${h.id}" class="toc-item${cls}">${h.textContent}</a>`;
      });
      toc.innerHTML = html;

      // Active tracking on scroll
      const tocLinks = toc.querySelectorAll('.toc-item');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            tocLinks.forEach(l => l.classList.remove('active'));
            const link = toc.querySelector(`a[href="#${entry.target.id}"]`);
            if (link) link.classList.add('active');
          }
        });
      }, { rootMargin: '-80px 0px -60% 0px' });
      headings.forEach(h => observer.observe(h));
    }

    // ==================== Markdown Rendering ====================
    function renderMarkdown(text) {
      // Configure marked
      marked.setOptions({
        highlight: function(code, lang) {
          if (lang && hljs.getLanguage(lang)) {
            return hljs.highlight(code, { language: lang }).value;
          }
          return hljs.highlightAuto(code).value;
        },
        breaks: true,
        gfm: true,
      });

      const html = marked.parse(text);
      document.getElementById('markdown-body').innerHTML = html;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('markdown-body').style.display = 'block';
      renderTOC();
    }

    // ==================== Load Document ====================
    async function loadDoc() {
      const params = new URLSearchParams(window.location.search);
      const fileId = params.get('file') || 'guide';
      const doc = DOCS.find(d => d.id === fileId);

      if (!doc) {
        showError('文档未找到', `未找到 ID 为 "${fileId}" 的文档。`);
        return;
      }

      // Update UI
      document.getElementById('nav-title').textContent = doc.label;
      document.title = `Cradle — ${doc.label}`;
      renderSidebar(fileId);

      // 1. Try inline data first (works on file:// protocol)
      if (INLINE_DOCS[doc.inline]) {
        renderMarkdown(INLINE_DOCS[doc.inline]);
        return;
      }

      // 2. Fallback to fetch (works on http://)
      try {
        const resp = await fetch(doc.file);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const text = await resp.text();
        renderMarkdown(text);
      } catch (err) {
        showError('加载失败', `无法加载文档：${err.message}。<br><small>提示：请运行 <code>bash site/build.sh</code> 构建内嵌文档。</small>`);
      }
    }

    function showError(title, message) {
      document.getElementById('loading').style.display = 'none';
      const el = document.getElementById('error');
      el.style.display = 'block';
      el.innerHTML = `<div class="error-box"><strong>${title}</strong><p style="margin-top:8px;margin-bottom:0">${message}</p></div>`;
    }

    // ==================== Init ====================
    loadDoc();
  </script>
</body>
</html>
